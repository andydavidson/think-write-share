# tws.nginx.conf — nginx virtual-host config for Think–Write–Share
#
# Install:
#   sudo cp tws.nginx.conf /etc/nginx/sites-available/tws
#   sudo ln -s /etc/nginx/sites-available/tws /etc/nginx/sites-enabled/tws
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every occurrence of "example.com" with your actual domain
# before installing. SSL certificates are managed by Certbot — see README.

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # --- SSL (managed by Certbot) -------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Logging ---------------------------------------------------------------
    # Privacy: keep access logs but strip the query string so that admin
    # tokens in URLs (e.g. /admin/slug/TOKEN) are not written to disk.
    log_format tws_privacy '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/tws_access.log tws_privacy;
    error_log  /var/log/nginx/tws_error.log warn;

    # --- Static files served directly by nginx --------------------------------
    # Faster than going through uvicorn; set a long cache TTL.
    location /static/ {
        alias /opt/tws/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # --- Proxy everything else to uvicorn -------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Do NOT forward X-Real-IP or X-Forwarded-For — the app does not use
        # them and we prefer not to pass IP addresses further than necessary.

        # Timeouts generous enough for the polling endpoints
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Limit upload size to a bit over the max answer length (5 000 chars)
        client_max_body_size 64k;
    }
}
