# tws.nginx.conf — nginx virtual-host config for Think–Write–Share
#
# Install:
#   sudo cp tws.nginx.conf /etc/nginx/sites-available/tws
#   sudo ln -s /etc/nginx/sites-available/tws /etc/nginx/sites-enabled/tws
#   sudo nginx -t && sudo systemctl reload nginx
#
# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name thinkwriteshare.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thinkwriteshare.net; 

    # --- SSL (managed by Certbot) -------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/thinkwriteshare.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinkwriteshare.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Logging ---------------------------------------------------------------
    # Privacy: keep access logs but strip the query string so that admin
    # tokens in URLs (e.g. /admin/slug/TOKEN) are not written to disk.
    access_log /var/log/nginx/tws_access.log;
    error_log  /var/log/nginx/tws_error.log warn;

    # --- Static files served directly by nginx --------------------------------
    # Faster than going through uvicorn; set a long cache TTL.
    location /static/ {
        alias /home/andy/src/think-write-share/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # --- Proxy everything else to uvicorn -------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Do NOT forward X-Real-IP or X-Forwarded-For — the app does not use
        # them and we prefer not to pass IP addresses further than necessary.

        # Timeouts generous enough for the polling endpoints
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Limit upload size to a bit over the max answer length (5 000 chars)
        client_max_body_size 64k;
    }
}

server {
    if ($host = www.thinkwriteshare.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.thinkwriteshare.net;

    # Allow certbot ACME challenges through before redirecting
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://thinkwriteshare.net/;
    }

}

server {
    listen 443;
    listen [::]:443;
    server_name www.thinkwriteshare.net;

    # --- TLS certificates (managed by certbot or set manually) ---
    ssl_certificate /etc/letsencrypt/live/www.thinkwriteshare.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.thinkwriteshare.net/privkey.pem; # managed by Certbot

    # Recommended: uncomment if you use certbot's managed options file
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Modern TLS — TLSv1.2 kept for older MCP clients; drop it if not needed
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Allow certbot ACME challenges through before redirecting
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://thinkwriteshare.net/;
    }

}

